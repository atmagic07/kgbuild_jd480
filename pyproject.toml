[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atmagic07-kgbuild_jd480"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对知识图谱构建工程师·SLO 违约的归因链路相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "atmagic07" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://atmagic07.github.io"
Repository = "https://github.com/atmagic07/kgbuild_jd480"
Issues = "https://github.com/atmagic07/kgbuild_jd480/issues"

[project.scripts]
kgbuild_jd480 = "kgbuild_jd480:main"

[tool.setuptools]
py-modules = ["kgbuild_jd480"]
